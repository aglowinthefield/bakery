<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Bakery</title>
    <script>
      try {
        const theme = localStorage.getItem("bakery-theme");
        if (theme && theme !== "default" && /^[a-z-]+$/.test(theme)) document.documentElement.dataset.theme = theme;
        const density = localStorage.getItem("bakery-density");
        if (density === "compact" || density === "cozy") document.documentElement.dataset.density = density;
      } catch { /* Storage can be disabled. The database still supplies the theme. */ }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/entry.tsx"></script></body>
</html>
