<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bakery</title>
    <script>
      try {
        if (localStorage.getItem("bakery-theme") === "light") document.documentElement.dataset.theme = "light";
      } catch { /* Storage can be disabled. The database still supplies the theme. */ }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
