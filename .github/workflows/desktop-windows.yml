name: Windows desktop installer

on:
  push:
    paths:
      - .github/workflows/desktop-windows.yml
      - desktop/**
      - src-tauri/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test desktop Rust code on Windows
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build unsigned Windows installer
        run: npm run desktop:build -- --ci --no-sign --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: bakery-windows-x64-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
