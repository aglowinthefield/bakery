name: Alice
options:
  bundleIdPrefix: dev.alice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Alice:
    type: application
    platform: iOS
    sources:
      - path: Alice
        excludes:
          - "Resources/Icons"
      - path: Alice/Resources/Icons
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.alice.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Alice
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MYFY26Q83G
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: Alice/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Alice connects to your Alice server on your network.
        UILaunchScreen: {}
  AliceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AliceTests]
    dependencies:
      - target: Alice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.alice.ios.tests
  AliceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AliceUITests]
    dependencies:
      - target: Alice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.alice.ios.uitests
        TEST_TARGET_NAME: Alice
schemes:
  Alice:
    build:
      targets:
        Alice: all
    test:
      targets: [AliceTests, AliceUITests]
