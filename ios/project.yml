name: Bakery
options:
  bundleIdPrefix: dev.bakery
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bakery:
    type: application
    platform: iOS
    sources:
      - path: Bakery
        excludes:
          - "Resources/Icons"
      - path: Bakery/Resources/Icons
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bakery.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bakery
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Bakery/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Bakery connects to your Bakery server on your network.
        UILaunchScreen: {}
  BakeryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BakeryUITests]
    dependencies:
      - target: Bakery
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bakery.ios.uitests
        TEST_TARGET_NAME: Bakery
schemes:
  Bakery:
    build:
      targets:
        Bakery: all
    test:
      targets: [BakeryUITests]
